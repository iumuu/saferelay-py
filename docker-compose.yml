services:
  saferelay:
    image: ${SAFERELAY_IMAGE:-gvddfdf/saferelay-py:latest}
    build:
      context: .
    container_name: saferelay-py
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - saferelay-data:/app/data
      - saferelay-logs:/app/logs

  caddy:
    image: caddy:2-alpine
    container_name: saferelay-caddy
    restart: unless-stopped
    depends_on:
      - saferelay
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  saferelay-data:
  saferelay-logs:
  caddy_data:
  caddy_config:
